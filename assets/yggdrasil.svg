<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Yggdrasil — Anne Beth Andersen engineering portfolio</title>
<desc id="desc">A visual map connecting evidence, healthcare, data, software, cloud, automation and security through a central engineering tree.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#0c1725"/></linearGradient>
  <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70e0b1"/><stop offset="1" stop-color="#7da7ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<g opacity=".12" stroke="#9bb2cc"><path d="M80 80H1120M80 160H1120M80 560H1120M80 640H1120"/><path d="M160 60V660M300 60V660M900 60V660M1040 60V660"/></g>
<text x="600" y="58" text-anchor="middle" fill="#70e0b1" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">YGGDRASIL · ENGINEERING SYSTEM</text>
<text x="600" y="84" text-anchor="middle" fill="#9bb2cc" font-family="Arial,sans-serif" font-size="13">technology · healthcare · evidence · data · cloud · security</text>

<!-- roots -->
<g fill="none" stroke="url(#trunk)" stroke-width="8" stroke-linecap="round" opacity=".9">
<path d="M600 505C560 560 500 600 390 655"/><path d="M600 505C575 575 555 620 530 675"/>
<path d="M600 505C625 575 650 620 675 675"/><path d="M600 505C650 560 730 610 820 655"/>
</g>
<g fill="#07111d" stroke="#7da7ff" stroke-width="1.5">
<rect x="255" y="640" width="170" height="42" rx="10"/><rect x="465" y="658" width="130" height="42" rx="10"/>
<rect x="610" y="658" width="130" height="42" rx="10"/><rect x="775" y="640" width="170" height="42" rx="10"/>
</g>
<g fill="#dce8f4" font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><text x="340" y="666">RESEARCH &amp; EVIDENCE</text><text x="530" y="684">DATA</text><text x="675" y="684">AUTOMATION</text><text x="860" y="666">SECURITY</text></g>

<!-- trunk -->
<path d="M600 535C570 450 575 355 600 265C625 355 630 450 600 535Z" fill="url(#trunk)" opacity=".9" filter="url(#glow)"/>
<path d="M600 505C600 410 600 320 600 190" fill="none" stroke="#d7fff0" stroke-width="5" stroke-linecap="round"/>

<!-- branches -->
<g fill="none" stroke="url(#trunk)" stroke-width="6" stroke-linecap="round">
<path d="M600 285C535 245 475 220 385 205"/><path d="M600 325C665 280 735 235 815 205"/>
<path d="M600 365C520 350 440 335 345 330"/><path d="M600 400C690 370 765 345 855 330"/>
<path d="M600 235C560 180 520 145 470 120"/><path d="M600 235C640 180 680 145 730 120"/>
</g>

<!-- canopy nodes -->
<g font-family="Arial,sans-serif" text-anchor="middle">
<g fill="#07111d" stroke="#70e0b1" stroke-width="2">
<rect x="295" y="175" width="180" height="58" rx="13"/><rect x="725" y="175" width="180" height="58" rx="13"/>
<rect x="255" y="300" width="180" height="58" rx="13"/><rect x="765" y="300" width="180" height="58" rx="13"/>
<rect x="390" y="90" width="160" height="58" rx="13"/><rect x="650" y="90" width="160" height="58" rx="13"/>
</g>
<g fill="#dce8f4" font-size="15" font-weight="700">
<text x="385" y="201">EVIDENCE</text><text x="815" y="201">CLOUD</text>
<text x="345" y="326">HEALTHCARE</text><text x="855" y="326">SOFTWARE</text>
<text x="470" y="116">RESEARCH</text><text x="730" y="116">DEVSECOPS</text>
</g>
<g fill="#9bb2cc" font-size="11">
<text x="385" y="219">appraisal · traceability · methods</text><text x="815" y="219">Azure · Docker · Kubernetes</text>
<text x="345" y="344">clinical domain · workflows</text><text x="855" y="344">React · TypeScript · .NET · Python</text>
<text x="470" y="134">knowledge-based practice</text><text x="730" y="134">security · CI/CD · resilience</text>
</g>
</g>

<!-- centre -->
<circle cx="600" cy="190" r="48" fill="#07111d" stroke="#70e0b1" stroke-width="3" filter="url(#glow)"/>
<text x="600" y="185" text-anchor="middle" fill="#dffff2" font-family="Arial,sans-serif" font-size="13" font-weight="700">BUILD</text>
<text x="600" y="203" text-anchor="middle" fill="#9bb2cc" font-family="Arial,sans-serif" font-size="10">TEST · DOCUMENT · VALIDATE</text>

<!-- projects -->
<g fill="#9bb2cc" font-family="Arial,sans-serif" font-size="11">
<text x="85" y="112">SELECTED SYSTEMS</text>
<text x="85" y="132">Evidence Appraisal Tool</text>
<text x="85" y="150">Azure Kubernetes Showcase</text>
<text x="85" y="168">Healthcare Data Analyzer</text>
<text x="1115" y="550" text-anchor="end">STATUS</text>
<text x="1115" y="570" text-anchor="end" fill="#70e0b1">INSPECTABLE · MODULAR</text>
<text x="1115" y="588" text-anchor="end">prototype ≠ verified ≠ production</text>
</g>
</svg>