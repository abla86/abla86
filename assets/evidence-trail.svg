<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">Evidence trail</title><desc id="d">Problem, research, architecture, implementation, testing, verification, documentation and release.</desc><rect width="1200" height="260" rx="24" fill="#050a11"/><path d="M80 130 H1120" stroke="#29465d" stroke-width="3"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><circle cx="80" cy="130" r="26" fill="#07131e" stroke="#a98cff" stroke-width="3"/><text x="80" y="185" fill="#c7d5df" font-size="11" font-weight="700">PROBLEM</text><circle cx="229" cy="130" r="26" fill="#07131e" stroke="#a98cff" stroke-width="3"/><text x="229" y="185" fill="#c7d5df" font-size="11" font-weight="700">RESEARCH</text><circle cx="378" cy="130" r="26" fill="#07131e" stroke="#58c7ff" stroke-width="3"/><text x="378" y="185" fill="#c7d5df" font-size="11" font-weight="700">ARCHITECTURE</text><circle cx="527" cy="130" r="26" fill="#07131e" stroke="#58c7ff" stroke-width="3"/><text x="527" y="185" fill="#c7d5df" font-size="11" font-weight="700">IMPLEMENT</text><circle cx="676" cy="130" r="26" fill="#07131e" stroke="#55d58a" stroke-width="3"/><text x="676" y="185" fill="#c7d5df" font-size="11" font-weight="700">TEST</text><circle cx="825" cy="130" r="26" fill="#07131e" stroke="#55d58a" stroke-width="3"/><text x="825" y="185" fill="#c7d5df" font-size="11" font-weight="700">VERIFY</text><circle cx="974" cy="130" r="26" fill="#07131e" stroke="#ffb45c" stroke-width="3"/><text x="974" y="185" fill="#c7d5df" font-size="11" font-weight="700">DOCUMENT</text><circle cx="1123" cy="130" r="26" fill="#07131e" stroke="#ffb45c" stroke-width="3"/><text x="1123" y="185" fill="#c7d5df" font-size="11" font-weight="700">RELEASE</text></g><text x="600" y="70" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="800">TRACEABILITY FROM QUESTION TO RELEASE</text></svg>