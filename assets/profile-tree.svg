<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Anne Beth Andersen — living engineering map</title>
<desc id="desc">An animated Yggdrasil-inspired engineering map connecting software, cloud, evidence, healthcare, security, data and automation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a12"/><stop offset=".52" stop-color="#0b1422"/><stop offset="1" stop-color="#111c2c"/></linearGradient>
  <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#55e0b0"/><stop offset=".5" stop-color="#8ca8ff"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#17352f"/><stop offset=".55" stop-color="#0b1822"/><stop offset="1" stop-color="#07101a"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1600" height="560" rx="34" fill="url(#bg)"/>
<g opacity=".09" stroke="#c6d8ef">
  <path d="M55 105H1545M55 210H1545M55 315H1545M55 420H1545"/>
  <path d="M170 45V510M410 45V510M1190 45V510M1430 45V510"/>
</g>

<!-- identity -->
<g font-family="Arial,sans-serif">
  <text x="70" y="76" fill="#75e2b5" font-size="15" font-weight="700" letter-spacing="4">AB / ENGINEERING MAP</text>
  <text x="70" y="122" fill="#edf7ff" font-size="34" font-weight="700">Anne Beth Andersen</text>
  <text x="70" y="151" fill="#91a8c1" font-size="15">software · cloud · evidence · healthcare · security · data</text>
  <g transform="translate(1260 82)">
    <circle cx="0" cy="0" r="5" fill="#75e2b5"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="16" y="4" fill="#75e2b5" font-size="10" font-weight="700" letter-spacing="3">SYSTEM SIGNAL / LIVE</text>
  </g>
  <text x="70" y="206" fill="#d9e7f5" font-size="13">I build systems that can be inspected.</text>
  <text x="70" y="230" fill="#8299b2" font-size="12">code → test → document → validate</text>
</g>

<!-- roots -->
<g fill="none" stroke="url(#trunk)" stroke-width="4" stroke-linecap="round" opacity=".72">
  <path d="M805 440 C690 475 590 510 455 525"/>
  <path d="M805 440 C735 490 675 515 600 535"/>
  <path d="M805 440 C870 490 930 515 1010 535"/>
  <path d="M805 440 C920 475 1040 510 1160 525"/>
</g>
<g font-family="Arial,sans-serif" font-size="10" text-anchor="middle">
  <g fill="#07111b" stroke="#607da8">
    <rect x="380" y="506" width="150" height="30" rx="9"/>
    <rect x="535" y="519" width="130" height="28" rx="9"/>
    <rect x="945" y="519" width="130" height="28" rx="9"/>
    <rect x="1085" y="506" width="150" height="30" rx="9"/>
  </g>
  <g fill="#d6e5f3"><text x="455" y="525">RESEARCH</text><text x="600" y="537">DATA</text><text x="1010" y="537">AUTOMATION</text><text x="1160" y="525">SECURITY</text></g>
</g>

<!-- tree -->
<g fill="none" stroke="url(#trunk)" stroke-linecap="round" filter="url(#glow)">
  <path d="M805 448 C770 365 790 270 805 165" stroke-width="32" opacity=".72"/>
  <path d="M805 445 C805 350 805 255 805 112" stroke="#e8fff7" stroke-width="5"/>
  <path d="M805 330 C730 292 670 252 595 220" stroke-width="5"/>
  <path d="M805 350 C885 305 950 260 1020 220" stroke-width="5"/>
  <path d="M805 275 C750 232 710 182 675 112" stroke-width="5"/>
  <path d="M805 275 C860 232 905 182 940 112" stroke-width="5"/>
</g>

<!-- orbit -->
<g fill="none" stroke="#7da7ff" opacity=".17">
  <ellipse cx="805" cy="320" rx="135" ry="92"/>
  <ellipse cx="805" cy="320" rx="178" ry="122"/>
</g>

<!-- moving signal -->
<g fill="#dffff4" filter="url(#glow)">
  <circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M805 448 C770 365 790 270 805 165"/></circle>
  <circle r="4"><animateMotion dur="4.8s" begin=".4s" repeatCount="indefinite" path="M805 330 C730 292 670 252 595 220"/></circle>
  <circle r="4"><animateMotion dur="5.2s" begin="1.1s" repeatCount="indefinite" path="M805 350 C885 305 950 260 1020 220"/></circle>
  <circle r="4"><animateMotion dur="4.6s" begin="1.8s" repeatCount="indefinite" path="M805 275 C750 232 710 182 675 112"/></circle>
  <circle r="4"><animateMotion dur="5.6s" begin="2.4s" repeatCount="indefinite" path="M805 275 C860 232 905 182 940 112"/></circle>
</g>

<!-- capability nodes -->
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g fill="#07111b" stroke="#75e2b5" stroke-width="2">
    <rect x="495" y="190" width="200" height="62" rx="15"/>
    <rect x="920" y="190" width="200" height="62" rx="15"/>
    <rect x="570" y="80" width="195" height="62" rx="15"/>
    <rect x="845" y="80" width="205" height="62" rx="15"/>
  </g>
  <g fill="#e5f1fb" font-size="15" font-weight="700">
    <text x="595" y="216">SOFTWARE</text><text x="1020" y="216">CLOUD</text>
    <text x="667" y="106">EVIDENCE</text><text x="947" y="106">HEALTHCARE</text>
  </g>
  <g fill="#8ea5bd" font-size="10">
    <text x="595" y="236">Python · React · .NET · APIs</text>
    <text x="1020" y="236">Azure · Kubernetes · CI/CD</text>
    <text x="667" y="126">traceability · research support</text>
    <text x="947" y="126">clinical · health technology</text>
  </g>
</g>

<!-- core -->
<circle cx="805" cy="320" r="49" fill="url(#core)" stroke="#75e2b5" stroke-width="3" filter="url(#glow)">
  <animate attributeName="r" values="47;52;47" dur="3.2s" repeatCount="indefinite"/>
</circle>
<text x="805" y="316" text-anchor="middle" fill="#effff8" font-family="Arial,sans-serif" font-size="13" font-weight="700">BUILD</text>
<text x="805" y="335" text-anchor="middle" fill="#8fa7bf" font-family="Arial,sans-serif" font-size="9">TEST · PROVE</text>

<!-- right navigation -->
<g font-family="Arial,sans-serif">
  <text x="1260" y="185" fill="#75e2b5" font-size="11" font-weight="700" letter-spacing="3">PROFILE ≠ PORTFOLIO</text>
  <text x="1260" y="224" fill="#edf7ff" font-size="22" font-weight="700">The map is here.</text>
  <text x="1260" y="250" fill="#8ea5bd" font-size="12">The implementation lives in</text>
  <text x="1260" y="270" fill="#8ea5bd" font-size="12">repositories and the portfolio.</text>
  <text x="1260" y="325" fill="#75e2b5" font-size="11" font-weight="700">CLICK BELOW</text>
  <text x="1260" y="351" fill="#dceaf7" font-size="14">EXPLORE THE SYSTEM →</text>
  <path d="M1260 368 H1470" stroke="#75e2b5" stroke-width="2" opacity=".35"/>
  <circle cx="1260" cy="368" r="3" fill="#75e2b5"><animate attributeName="cx" values="1260;1470;1260" dur="3.8s" repeatCount="indefinite"/></circle>
</g>

<!-- tiny status -->
<g font-family="Arial,sans-serif" font-size="9">
  <text x="70" y="475" fill="#6f879f">PUBLIC CODE</text>
  <text x="175" y="475" fill="#6f879f">·</text>
  <text x="195" y="475" fill="#6f879f">VERIFIABLE WORK</text>
  <text x="335" y="475" fill="#6f879f">·</text>
  <text x="355" y="475" fill="#6f879f">NO KEYWORD WALL</text>
</g>
</svg>